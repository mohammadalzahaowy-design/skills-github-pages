<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everyday Tech | Electronics</title>
  <meta name="description" content="Browse everyday electronics and accessories.">

  <!-- Replace BOTH G-XXXXXXXXXX values with your Google Analytics measurement ID. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX', { debug_mode: true });
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #202a35; background: #f5f6f8; }
    header { background: #204363; color: white; padding: 19px 0; }
    .container { width: min(960px, calc(100% - 32px)); margin: auto; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { color: #fff; font-size: 23px; text-decoration: none; font-weight: bold; }
    .cart { background: #fff; color: #204363; border: 0; border-radius: 4px; padding: 10px 14px; font-weight: bold; }
    h1 { font-size: 30px; margin: 38px 0 9px; }
    .subtitle { color: #66717a; margin: 0 0 28px; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input { flex: 1; min-width: 0; padding: 11px; border: 1px solid #c7cdd3; border-radius: 4px; font-size: 15px; }
    button { cursor: pointer; font: inherit; }
    .search-btn, .buy { background: #2567a6; color: white; border: none; border-radius: 4px; padding: 11px 15px; }
    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .product { background: white; border: 1px solid #dce1e5; border-radius: 5px; padding: 20px; }
    .product .emoji { height: 115px; display: grid; place-items: center; font-size: 65px; background: #edf1f5; border-radius: 3px; }
    .product h2 { font-size: 18px; margin: 17px 0 7px; }
    .price { font-weight: bold; margin: 12px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .details { background: #fff; border: 1px solid #abb7c2; border-radius: 4px; padding: 10px 13px; }
    .message { min-height: 24px; margin-top: 22px; color: #246449; }
    footer { padding: 38px 0 24px; margin-top: 32px; font-size: 13px; color: #6c7680; }
    @media (max-width: 720px) { .products { grid-template-columns: 1fr; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <header><div class="container head">
    <a href="./" class="brand">Everyday Tech</a>
    <span class="cart">Cart: <span id="cart-count">0</span></span>
  </div></header>
  <main class="container">
    <h1>Electronics & Accessories</h1>
    <p class="subtitle">Browse our selection of everyday tech essentials.</p>
    <form id="search-form">
      <input id="search" type="search" placeholder="Search products" aria-label="Search products">
      <button class="search-btn" type="submit">Search</button>
    </form>
    <div class="products" id="products"></div>
    <p class="message" id="message" aria-live="polite"></p>
  </main>
  <footer class="container">Everyday Tech · Product listings are illustrative. No purchases are processed.</footer>
  <script>
    const products = [
      { id: 'usb64', name: '64GB USB Flash Drive', price: 19.95, emoji: '💾', category: 'Storage' },
      { id: 'mouse01', name: 'Wireless Mouse', price: 29.95, emoji: '🖱️', category: 'Accessories' },
      { id: 'headphone01', name: 'Over-Ear Headphones', price: 49.95, emoji: '🎧', category: 'Audio' }
    ];
    let cartCount = 0;
    const list = document.getElementById('products');
    const message = document.getElementById('message');
    function itemData(product) {
      return {item_id: product.id, item_name: product.name, item_category: product.category, price: product.price, quantity: 1};
    }
    function render(query = '') {
      const filtered = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));
      list.innerHTML = '';
      if (!filtered.length) { list.textContent = 'No matching products found.'; return; }
      filtered.forEach(p => {
        const card = document.createElement('article');
        card.className = 'product';
        card.innerHTML = `<div class="emoji" aria-hidden="true">${p.emoji}</div><h2>${p.name}</h2><div class="price">$${p.price.toFixed(2)}</div><div class="actions"><button class="details" type="button">View details</button><button class="buy" type="button">Add to cart</button></div>`;
        card.querySelector('.details').addEventListener('click', () => {
          gtag('event', 'view_item', {currency: 'AUD', value: p.price, items: [itemData(p)]});
          message.textContent = `${p.name} — $${p.price.toFixed(2)}.`;
        });
        card.querySelector('.buy').addEventListener('click', () => {
          cartCount++;
          document.getElementById('cart-count').textContent = cartCount;
          gtag('event', 'add_to_cart', {currency: 'AUD', value: p.price, items: [itemData(p)]});
          message.textContent = `${p.name} added to cart.`;
        });
        list.appendChild(card);
      });
    }
    document.getElementById('search-form').addEventListener('submit', event => {
      event.preventDefault();
      const query = document.getElementById('search').value.trim();
      if (query) gtag('event', 'search', {search_term: query});
      render(query);
      message.textContent = query ? `Search results for "${query}".` : '';
    });
    render();
  </script>
</body>
</html>
